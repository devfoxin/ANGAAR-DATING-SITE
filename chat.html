<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <a href="selection.html" class="back-btn">⬅ Back</a>
            <h3 id="bot-name">AI Companion</h3>
        </header>

        <div class="chat-box" id="chat-box">
            <div class="message bot-msg">Hey there! Glad you finally messaged me. 😊</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a romantic message...">
            <button id="send-btn">Send ⚡</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
